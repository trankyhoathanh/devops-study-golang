name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Sửa: dùng v4, bỏ dockerfile (dùng file mặc định), bỏ cache
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Không dùng cache để tránh lỗi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    environment: ${{ github.ref_name }}
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          ENV: ${{ vars.ENV }}
          PORT: ${{ vars.PORT }}
          CONTAINER: ${{ vars.CONTAINER }}
        run: |
          echo "🚀 Deploying $BRANCH_NAME to port $PORT..."
          
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            echo "🔑 Logging to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling image..."
            docker pull $REGISTRY/$IMAGE_NAME:$BRANCH_NAME
            
            echo "🛑 Stopping old container..."
            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true
            
            echo "🚀 Starting new container on port $PORT..."
            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p $PORT:8080 \
              -e GIN_MODE=release \
              -e PORT=8080 \
              -e ENV=$ENV \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              $REGISTRY/$IMAGE_NAME:$BRANCH_NAME
            
            # Kiểm tra container
            sleep 3
            if docker ps | grep -q $CONTAINER; then
              echo "✅ Container started successfully!"
              echo "📋 Container logs:"
              docker logs --tail 10 $CONTAINER
            else
              echo "❌ Container failed to start!"
              docker logs $CONTAINER
              exit 1
            fi
            
            echo "✅ Deployment complete!"
            echo "📋 Container status:"
            docker ps | grep $CONTAINER
            
            # Dọn dẹp images cũ
            echo "🧹 Cleaning up old images..."
            docker image prune -f
          EOF